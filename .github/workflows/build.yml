name: Build GdeBolit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort

          PROJECT_DIR=""

          SETTINGS=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Project found: $PROJECT_DIR"
          else
            ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: ZIP with Android project not found"
              exit 1
            fi

            echo "ZIP found: $ZIP"

            rm -rf extracted
            mkdir extracted

            unzip -q "$ZIP" -d extracted

            SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle not found inside ZIP"
              find extracted -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Project extracted to: $PROJECT_DIR"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java 17
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f app/build.gradle ]; then
            python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle")
s = p.read_text()

if "compileOptions" not in s:
    s = s.replace(
        "android {",
        """android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }""",
        1
    )

p.write_text(s)
PY
          fi

          cat app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GdeBolit-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
