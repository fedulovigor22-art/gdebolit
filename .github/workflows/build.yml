name: Build GdeBolit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find GdeBolit ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for GdeBolit ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname 'GdeBolit*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: GdeBolit ZIP not found"
            echo "Available ZIP files:"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack Android project
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          echo "Unpacking:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android_project

          echo "Project files:"
          find android_project -maxdepth 4 -type f -print

      - name: Check Android project
        shell: bash
        run: |
          set -e

          if [ ! -f "android_project/settings.gradle.kts" ] && \
             [ ! -f "android_project/settings.gradle" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "android_project/build.gradle.kts" ] && \
             [ ! -f "android_project/build.gradle" ]; then
            echo "ERROR: build.gradle or build.gradle.kts not found"
            exit 1
          fi

          echo "Android project detected successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android_project

          echo "Starting Gradle build..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find android_project -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            find android_project -type f -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GdeBolit-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
