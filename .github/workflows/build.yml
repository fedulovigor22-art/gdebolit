name: Build GdeBolit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find GdeBolit ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for GdeBolit ZIP..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname 'GdeBolit*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: GdeBolit ZIP not found"
            echo "Available ZIP files:"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack Android project
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          echo "Unpacking:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android_project

          echo "Contents:"
          find android_project -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find android_project -type f -name 'gradlew' -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found"
            find android_project -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GdeBolit-debug
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
