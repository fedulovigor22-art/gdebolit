name: Build GdeBolit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find project
        shell: bash
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f | head -200

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        shell: bash
        run: |
          find . -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            GRADLEW=$(find . -name gradlew -type f | head -1)
            if [ -n "$GRADLEW" ]; then
              cd "$(dirname "$GRADLEW")"
              ./gradlew assembleDebug
            else
              echo "gradlew not found"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GdeBolit-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
