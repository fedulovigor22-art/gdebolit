name: Build GdeBolit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find GdeBolit ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'GdeBolit_GitHub_READY(3).zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: GdeBolit_GitHub_READY(3).zip not found"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name '*.zip' -print
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Unpack Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "=== PROJECT CONTENT ==="
          find android-project -maxdepth 3 -type f -print

          if [ ! -f android-project/settings.gradle ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -f android-project/build.gradle ]; then
            echo "ERROR: build.gradle not found"
            exit 1
          fi

          if [ ! -f android-project/app/build.gradle ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi

          echo "Android project found successfully."

      - name: Build Debug APK
        shell: bash
        working-directory: android-project
        run: |
          set -e

          echo "=== BUILD DIRECTORY ==="
          pwd

          echo "=== BUILD FILES ==="
          ls -la
          ls -la app

          echo "=== BUILD START ==="

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

          echo "=== BUILD FINISHED ==="

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== APK FILES ==="

          find android-project \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            -print

          APK_COUNT="$(find android-project \
            -type f \
            -path '*/build/outputs/apk/*.apk' \
            | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK_COUNT=$APK_COUNT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GdeBolit-APK
          path: 'android-project/**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
